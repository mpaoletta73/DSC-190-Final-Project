[project]
name = "sports-ref-scraper"
version = "0.1.0"
description = "A command-line tool to download tables from sports-reference.com sites as CSV files."
readme = "README.md"
authors = [
    { name = "mpaoletta73" }
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "click>=8.4.1",
    "lxml>=6.1.1",
    "requests>=2.34.2",
]

[project.scripts]
sportsref = "sports_ref_scraper.cli:cli"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"
