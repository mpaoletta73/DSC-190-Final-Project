[project]
name = "sports-ref-scraper"
version = "0.1.0"
description = "A command-line tool to download tables from sports-reference.com sites as CSV files."
readme = "README.md"
authors = [
    { name = "mpaoletta73" }
]
requires-python = ">=3.8"
dependencies = [
    "beautifulsoup4>=4.9.0",
    "click>=8.0.0",
    "lxml>=4.6.0",
    "requests>=2.25.0",
]

[project.scripts]
sportsref = "sports_ref_scraper.cli:cli"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"
